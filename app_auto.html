<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>19屆機場常用功能</title>
</head>
<body>
<p id="msg">正在跳轉商店……</p>
<a id="google" href="https://play.google.com/store/apps/details?id=appinventor.ai_a92paul.TIA19">Android／Google Play</a>
<br><br>
<a id="apple" href="https://apps.apple.com/us/app/19%E5%B1%86%E6%A9%9F%E5%A0%B4%E8%A8%88%E7%A8%8B%E8%BB%8A%E5%B8%B8%E7%94%A8%E5%8A%9F%E8%83%BD%E6%95%B4%E5%90%88/id6824562824">iPhone／iPad／App Store</a>

<script>
const ua = navigator.userAgent;
const ios = /iPhone|iPad|iPod/i.test(ua) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const android = /Android/i.test(ua);

if (ios || android) {
  document.getElementById("msg").textContent = "正在前往對應的應用程式商店……";
  location.replace(ios
    ? document.getElementById("apple").href
    : document.getElementById("google").href);
} else {
  document.getElementById("msg").textContent = "請選擇您的裝置，前往下載：";
}
</script>
</body>
</html>
